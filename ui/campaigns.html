<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campaigns — Lead Campaign Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'sans-serif'] },
    colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } }
  } } };
</script>
<link rel="stylesheet" href="assets/css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body data-page="campaigns" class="bg-slate-50 text-slate-800">

  <div class="flex min-h-screen">
    <aside id="sidebar"></aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <header id="topbar"></header>

      <main id="page-content" class="flex-1 p-4 sm:p-6 space-y-5 max-w-[1600px] w-full mx-auto">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800">Campaigns</h1>
            <p class="text-sm text-slate-500 mt-0.5">จัดการแคมเปญค้นหา Lead ลูกค้าธุรกิจ · <span id="campaigns-total-count">0</span> รายการทั้งหมด</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="btn-refresh" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 border border-slate-200 hover:bg-slate-50 rounded-lg px-3 py-2">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="btn-export" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 border border-slate-200 hover:bg-slate-50 rounded-lg px-3 py-2">
              <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden sm:inline">Export</span>
            </button>
            <a href="campaign-create.html" id="btn-create-campaign" class="hidden inline-flex items-center gap-1.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg px-3.5 py-2">
              <i data-lucide="plus" class="w-4 h-4"></i> สร้าง Campaign
            </a>
          </div>
        </div>

        <!-- Summary Cards -->
        <div id="campaign-summary-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Search & Filters -->
        <div class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-4 space-y-3">
          <div class="flex flex-col lg:flex-row gap-3">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input id="campaigns-search" type="text" placeholder="ค้นหาชื่อ Campaign..."
                     class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 outline-none transition" />
            </div>
            <button id="btn-toggle-filters" class="inline-flex items-center justify-center gap-1.5 text-sm font-medium text-slate-600 border border-slate-200 hover:bg-slate-50 rounded-lg px-3.5 py-2">
              <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> ตัวกรอง
              <span id="active-filter-badge" class="hidden ml-1 bg-indigo-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center"></span>
            </button>
          </div>

          <div id="filters-panel" class="hidden grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 pt-3 border-t border-slate-100">
            <select id="filter-status" class="filter-input"><option value="">สถานะทั้งหมด</option></select>
            <select id="filter-province" class="filter-input"><option value="">จังหวัดทั้งหมด</option></select>
            <select id="filter-business-type" class="filter-input"><option value="">ประเภทธุรกิจทั้งหมด</option></select>
            <select id="filter-creator" class="filter-input"><option value="">ผู้สร้างทั้งหมด</option></select>
            <input id="filter-date-from" type="date" class="filter-input" title="วันที่สร้าง (ตั้งแต่)" />
          </div>
          <div id="filters-reset-row" class="hidden justify-end">
            <button id="btn-reset-filters" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">รีเซ็ตตัวกรองทั้งหมด</button>
          </div>
        </div>

        <!-- Bulk action bar -->
        <div id="bulk-bar" class="hidden items-center gap-3 bg-indigo-50 ring-1 ring-indigo-100 rounded-xl px-4 py-2.5 text-sm">
          <span class="text-indigo-700 font-medium"><span id="bulk-count">0</span> รายการถูกเลือก</span>
          <div class="flex-1"></div>
          <button id="bulk-export" class="text-indigo-600 hover:text-indigo-800 font-medium">Export ที่เลือก</button>
          <button id="bulk-delete" class="text-rose-600 hover:text-rose-800 font-medium">ลบที่เลือก</button>
        </div>

        <!-- Table (desktop) -->
        <div class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm overflow-hidden hidden md:block">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 sticky top-0 z-10">
                <tr id="table-head-row" class="text-left text-slate-500 text-xs uppercase tracking-wide"></tr>
              </thead>
              <tbody id="campaigns-table-body" class="divide-y divide-slate-50"></tbody>
            </table>
          </div>
        </div>

        <!-- Card list (mobile) -->
        <div id="campaigns-card-list" class="md:hidden space-y-3"></div>

        <!-- Pagination -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-4">
          <div class="flex items-center gap-2 text-sm text-slate-500">
            <span>แสดง</span>
            <select id="page-size-select" class="filter-input !py-1.5">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            <span>รายการต่อหน้า</span>
          </div>
          <p id="pagination-info" class="text-sm text-slate-500"></p>
          <div id="pagination-controls" class="flex items-center gap-1"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/topbar.js"></script>
  <script src="assets/js/campaigns.js"></script>
</body>
</html>
