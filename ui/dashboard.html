<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Lead Campaign Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'sans-serif'] },
    colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } }
  } } };
</script>
<link rel="stylesheet" href="assets/css/app.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3"></script>
</head>
<body data-page="dashboard" class="bg-slate-50 text-slate-800">

  <div class="flex min-h-screen">
    <aside id="sidebar"></aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <header id="topbar"></header>

      <main id="page-content" class="flex-1 p-4 sm:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800">ภาพรวมระบบค้นหา Lead</h1>
            <p id="dashboard-scope-desc" class="text-sm text-slate-500 mt-0.5"></p>
          </div>
          <a href="campaign-create.html" id="dashboard-create-btn" class="hidden inline-flex items-center gap-1.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg px-3.5 py-2">
            <i data-lucide="plus" class="w-4 h-4"></i> สร้าง Campaign
          </a>
        </div>

        <!-- Summary Cards -->
        <div id="summary-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
          <div class="card-surface xl:col-span-2 bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-5">
            <h2 class="font-semibold text-slate-800 mb-4">Lead ที่ค้นพบรายวัน (14 วันล่าสุด)</h2>
            <div id="chart-leads-daily" class="min-h-[280px]"></div>
          </div>
          <div class="card-surface bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-5">
            <h2 class="font-semibold text-slate-800 mb-4">Campaign แยกตามสถานะ</h2>
            <div id="chart-campaign-status" class="min-h-[280px]"></div>
          </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
          <div class="card-surface bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-slate-800">Campaign ล่าสุด</h2>
              <a href="campaigns.html" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">ดูทั้งหมด</a>
            </div>
            <div id="recent-campaigns-list" class="divide-y divide-slate-50"></div>
          </div>

          <div class="card-surface bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-slate-800">Lead คุณภาพสูงล่าสุด</h2>
              <a href="leads.html" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">ดูทั้งหมด</a>
            </div>
            <div id="top-leads-list" class="divide-y divide-slate-50"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/topbar.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
