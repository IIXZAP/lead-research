# infrastructure/railway/nginx.conf
#
# Same as infrastructure/nginx/default.conf, with two changes for running
# inside the same container as php-fpm on Railway:
#   1. fastcgi_pass points to 127.0.0.1:9000 instead of the "laravel" service
#      hostname, since there's no separate container to reach over the
#      Docker network anymore.
#   2. listen 8080 instead of 80, matching the port this Dockerfile exposes.
#      (Set your Railway service's target port to 8080 to match.)

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Railway terminates TLS for you at the edge and forwards plain HTTP to this
# container, so no certificate setup is needed here (unlike the VPS path).
# Just make sure SESSION_SECURE_COOKIE=true and TRUSTED_PROXIES is set so
# Laravel knows the original request was HTTPS (see env notes).