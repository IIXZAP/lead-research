server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --- Production ---
# This repo's docker-compose.yml terminates plain HTTP on purpose, so local
# dev works with zero certificate setup. In production, terminate TLS
# either at this nginx (uncomment below, mount real certs, and redirect the
# server block above to 443) or at an upstream load balancer/ingress that
# already speaks HTTPS to the outside world — either way, make sure
# SESSION_SECURE_COOKIE=true and the app is only ever reached over HTTPS.
#
